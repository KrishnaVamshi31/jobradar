# Runs JobRadar automatically every morning on GitHub's servers.
#
# Your laptop can be shut. GitHub spins up a fresh Linux machine, installs
# Python, runs the scraper, and commits the updated job list back into this
# repository - so your job history builds up online day after day.
#
# You can also trigger it by hand from the Actions tab on GitHub.

name: Daily job scan

on:
  schedule:
    # 03:30 UTC is 09:00 in India (IST is UTC+5:30).
    # GitHub uses UTC, so schedules always have to be converted.
    - cron: "30 3 * * *"

  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

# Allow this workflow to push its results back into the repo.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the tests first
        # If the tests fail, stop here rather than saving bad data.
        run: python -m pytest -q

      - name: Scan the job boards
        env:
          # These come from repository Settings -> Secrets and variables ->
          # Actions. If you have not added them, the Adzuna source simply
          # skips and the other four still run.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python main.py

      - name: Save the report as a downloadable file
        uses: actions/upload-artifact@v4
        with:
          name: job-report
          path: data/report.html
          retention-days: 30

      - name: Commit the updated job list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # data/ is in .gitignore for local use, so -f forces these in.
          git add -f data/jobs.csv data/jobs.xlsx

          # If nothing changed today, "git commit" fails - so we check first
          # and exit cleanly instead of failing the whole run.
          if git diff --staged --quiet; then
            echo "No new jobs today, nothing to commit."
          else
            git commit -m "Daily job scan: $(date -u '+%Y-%m-%d')"
            git push
          fi
